name: Export game builds

# Packages Vespergard as standalone executables (Linux + Windows) so nobody
# needs Godot installed to play. Runs on every push to main/claude branches
# and on demand; grab the files from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["docs/**", "*.md"]

env:
  GODOT_VERSION: "4.7"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          set -e
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project resources
        run: godot --headless --path . --import 2>&1 | tail -2 || true

      - name: Export Linux
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux" build/vespergard-linux.x86_64 2>&1 | tail -3
          test -f build/vespergard-linux.x86_64

      - name: Export Windows
        run: |
          godot --headless --path . --export-release "Windows" build/vespergard-windows.exe 2>&1 | tail -3
          test -f build/vespergard-windows.exe

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -3
          test -s build/web/index.wasm && test -s build/web/index.pck

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: vespergard-linux
          path: build/vespergard-linux.x86_64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vespergard-windows
          path: build/vespergard-windows.exe

      # The playable page Vercel serves. Uploaded so a run proves the web
      # export still builds even when nobody is deploying, and so the same
      # directory can be handed to `vercel deploy --prebuilt`. play.py rides
      # along because the download is useless without it: the threaded build
      # needs SharedArrayBuffer, so opening index.html from disk (or from any
      # static server that does not send COOP/COEP) loads the engine and stops.
      - name: Add the local runner to the web build
        run: cp tools/web_play.py build/web/play.py

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: vespergard-web
          path: build/web
